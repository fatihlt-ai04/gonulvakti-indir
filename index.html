<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GönülVakti – Uygulamayı İndir</title>
<meta name="theme-color" content="#050a0c">
<style>
:root{--bg:#050a0c;--card:rgba(14,22,24,.78);--gold:#e8c06a;--gold2:#a87a2e;--text:#f1e9d4;--muted:#8f9a98;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;margin:0}
body{background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(232,192,106,.12),transparent 70%),radial-gradient(ellipse 90% 60% at 50% 100%,rgba(20,60,50,.45),transparent 70%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 18px;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}
.card{width:100%;max-width:430px;background:var(--card);border:1px solid rgba(232,192,106,.18);border-radius:36px;padding:44px 26px 34px;text-align:center;backdrop-filter:blur(10px);box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.04);animation:up .7s ease both}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.logo{position:relative;width:132px;height:132px;margin:0 auto 26px}
.logo::before{content:"";position:absolute;inset:-26px;background:radial-gradient(circle,rgba(232,192,106,.35),transparent 65%);filter:blur(8px);animation:glow 3.5s ease-in-out infinite}
@keyframes glow{50%{opacity:.55;transform:scale(1.08)}}
.logo img{position:relative;width:100%;height:100%;border-radius:32px;border:1px solid rgba(232,192,106,.3);display:block;object-fit:cover}
h1{font-size:32px;line-height:1.15;margin:0 0 12px;font-weight:700;letter-spacing:.2px;background:linear-gradient(180deg,#f6dd9b,#c99a46);-webkit-background-clip:text;background-clip:text;color:transparent}
.rating{display:none;align-items:center;justify-content:center;gap:10px;margin-bottom:22px;color:var(--gold);font-size:17px}
.rating.show{display:flex}
.stars{letter-spacing:3px}
.sub{margin:0 0 22px;color:var(--muted);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:34px}
.chip{border:1px solid rgba(232,192,106,.22);background:rgba(255,255,255,.03);border-radius:999px;padding:11px 20px;font-size:15px;color:#d9d0b9}
.btn{position:relative;overflow:hidden;display:block;width:100%;border:0;border-radius:999px;padding:21px;font-size:19px;font-weight:700;color:#1b1305;background:linear-gradient(135deg,#f0cd7c,#b68a3b);cursor:pointer;box-shadow:0 10px 30px rgba(232,192,106,.25);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:140%}}
.warn{display:none;margin-top:30px;text-align:left}
.warn.show{display:block}
.warn .t{margin:0 0 14px;text-align:center;color:var(--muted);font-size:16px}
.step{display:flex;gap:14px;align-items:center;margin:14px 0;color:#cfc7b2;font-size:16px}
.num{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid rgba(232,192,106,.4);background:rgba(232,192,106,.06);display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:700}
.dots{display:inline-flex;align-items:center;justify-content:center;width:34px;height:30px;border:1px solid rgba(255,255,255,.12);border-radius:8px;background:rgba(255,255,255,.04);vertical-align:middle;margin:0 4px;font-weight:700;line-height:1}
.step b{color:var(--gold)}
.alt{display:block;margin:18px auto 0;color:var(--gold);font-size:14px;text-decoration:underline;background:none;border:0;cursor:pointer}
</style></head><body>
